name: Update Sitges Rodalies board

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create env file
        run: |
          echo "ADIF_URL=${{ secrets.ADIF_URL }}" >> .env
          echo "ADIF_COOKIE=${{ secrets.ADIF_COOKIE }}" >> .env

      - name: Update payload
        run: |
          python backend/scripts/update_all.py

      - name: Create status file
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          docs = Path("docs")
          docs.mkdir(exist_ok=True)

          status = {
              "generated_utc": datetime.now(timezone.utc).isoformat(),
              "ok": Path("docs/esp32_payload_latest.json").exists(),
          }

          Path("docs/status.json").write_text(
              json.dumps(status, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Commit updated public files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/esp32_payload_latest.json docs/status.json

          git diff --cached --quiet || git commit -m "Update public Rodalies payload"
          git push